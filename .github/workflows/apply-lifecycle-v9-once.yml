name: Apply lifecycle-v9 once

on:
  push:
    branches:
      - fix/sdrplay-device-lifecycle
    paths:
      - .github/workflows/apply-lifecycle-v9-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/sdrplay-device-lifecycle
          fetch-depth: 0

      - name: Patch SDRplay tune lifecycle
        shell: python
        run: |
          from pathlib import Path

          path = Path("source_modules/sdrplay_source/src/main.cpp")
          text = path.read_text()

          old_marker = "[SDRplay diag] lifecycle-v8: forwarded-data health validation + API recovery"
          new_marker = "[SDRplay diag] lifecycle-v9: forwarded-data validation + redundant-tune guard + API recovery"
          if text.count(old_marker) != 1:
              raise RuntimeError(f"marker count: {text.count(old_marker)}")
          text = text.replace(old_marker, new_marker, 1)

          old = '''    static void tune(double freq, void* ctx) {
        SDRPlaySourceModule* _this = (SDRPlaySourceModule*)ctx;
        if (_this->running) {
            _this->channelParams->tunerParams.rfFreq.rfHz = freq;
            sdrplay_api_Update(_this->openDev.dev, _this->openDev.tuner, sdrplay_api_Update_Tuner_Frf, sdrplay_api_Update_Ext1_None);
        }
        _this->freq = freq;
        flog::info("SDRPlaySourceModule '{0}': Tune: {1}!", _this->name, freq);
    }
'''
          new = '''    static void tune(double freq, void* ctx) {
        SDRPlaySourceModule* _this = (SDRPlaySourceModule*)ctx;
        const double previousFreq = _this->freq;
        _this->freq = freq;

        if (_this->running) {
            double delta = freq - previousFreq;
            if (delta < 0.0) { delta = -delta; }

            // MainWindow calls tune() immediately after start(), even though the same RF
            // frequency was already supplied before Init. Avoid a redundant Frf update at
            // exactly the point where otherwise healthy callback flow has been disappearing.
            if (delta < 1.0) {
                std::fprintf(stderr,
                             "[SDRplay diag] Tune skipped: unchanged RF %.0f Hz (callbacks=%llu swaps=%llu)\\n",
                             freq,
                             (unsigned long long)_this->streamCallbackCount.load(),
                             (unsigned long long)_this->successfulSwapCount.load());
                std::fflush(stderr);
                return;
            }

            _this->channelParams->tunerParams.rfFreq.rfHz = freq;
            const sdrplay_api_ErrT err = sdrplay_api_Update(
                _this->openDev.dev,
                _this->openDev.tuner,
                sdrplay_api_Update_Tuner_Frf,
                sdrplay_api_Update_Ext1_None);
            std::fprintf(stderr,
                         "[SDRplay diag] Tune update: %.0f -> %.0f Hz, result=%s, callbacks=%llu swaps=%llu\\n",
                         previousFreq, freq, sdrplay_api_GetErrorString(err),
                         (unsigned long long)_this->streamCallbackCount.load(),
                         (unsigned long long)_this->successfulSwapCount.load());
            std::fflush(stderr);
        }

        flog::info("SDRPlaySourceModule '{0}': Tune: {1}!", _this->name, freq);
    }
'''
          if text.count(old) != 1:
              raise RuntimeError(f"tune block count: {text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Commit source change
        run: |
          git config user.name "Rafael Fernandez"
          git config user.email "rfernandez@ficodes.com"
          git add source_modules/sdrplay_source/src/main.cpp
          git commit -m "diagnostic: skip redundant SDRplay retune after start"
          git push origin HEAD:fix/sdrplay-device-lifecycle
