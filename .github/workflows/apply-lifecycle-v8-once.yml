name: Apply lifecycle-v8 once

on:
  push:
    branches:
      - fix/sdrplay-device-lifecycle
    paths:
      - scripts/apply_lifecycle_v8.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/sdrplay-device-lifecycle
          fetch-depth: 0

      - name: Apply lifecycle-v8
        run: python3 scripts/apply_lifecycle_v8.py

      - name: Commit source change
        run: |
          git config user.name "Rafael Fernandez"
          git config user.email "rfernandez@ficodes.com"
          git add source_modules/sdrplay_source/src/main.cpp
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: validate forwarded SDRplay data flow"
          git push origin HEAD:fix/sdrplay-device-lifecycle
